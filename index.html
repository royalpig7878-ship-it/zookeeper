<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2d4a2b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zookeeper" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <title>Zookeeper: A Living Zoo</title>
    <style>
      html, body { margin: 0; height: 100%; width: 100%; background: #1c2b1c; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* The game is built for landscape. In portrait on a phone, a gentle note asks for a turn; it never blocks play. */
      #turn { display: none; position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 8; background: #2d3b2add; color: #f4ecd0; font: 14px/1.3 sans-serif; padding: 8px 14px; border-radius: 10px; border: 2px solid #f4ecd0; pointer-events: none; }
      @media (orientation: portrait) and (max-width: 700px) { #turn { display: block; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="turn">Turn your phone sideways for the best view</div>
    <script>
      // If the game cannot start, say so on screen instead of leaving a blank page.
      (function () {
        function show(msg) {
          if (document.getElementById('start-error')) return;
          var d = document.createElement('div');
          d.id = 'start-error';
          d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9;background:#2d1b1b;color:#ffd9a0;font:14px/1.4 sans-serif;padding:12px;border-radius:8px;border:2px solid #f4ecd0';
          d.textContent = 'The game could not start: ' + msg + ' Try reloading the page. If it keeps happening, tell the developer this message and which device and browser you are using.';
          document.body.appendChild(d);
        }
        window.addEventListener('error', function (e) { show(e.message || 'unknown error.'); });
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
