<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2d4a2b" />
    <title>Zookeeper: A Living Zoo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c2b1c; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #game { position: fixed; inset: 0; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // If the game cannot start, say so on screen instead of leaving a blank page.
      (function () {
        function show(msg) {
          if (document.getElementById('start-error')) return;
          var d = document.createElement('div');
          d.id = 'start-error';
          d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9;background:#2d1b1b;color:#ffd9a0;font:14px/1.4 sans-serif;padding:12px;border-radius:8px;border:2px solid #f4ecd0';
          d.textContent = 'The game could not start: ' + msg + ' Try reloading the page. If it keeps happening, tell the developer this message and which device and browser you are using.';
          document.body.appendChild(d);
        }
        window.addEventListener('error', function (e) { show(e.message || 'unknown error.'); });
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
